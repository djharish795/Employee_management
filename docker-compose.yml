services:
  postgres:
    image: postgres:15-alpine
    container_name: naprocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: naprocs
      POSTGRES_PASSWORD: naprocs_local_dev
      POSTGRES_DB: naprocs_ems
    ports:
      - "5432:5432"
    volumes:
      - naprocs_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: naprocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  naprocs_pg_data:
